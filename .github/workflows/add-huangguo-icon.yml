name: add-huangguo-icon

on:
  push:
    paths:
      - '.github/workflows/add-huangguo-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write huangguo icon
        run: |
          if [ -f huangguo.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > huangguo.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add huangguo.png
          git commit -m "Add huangguo icon"
          git push
