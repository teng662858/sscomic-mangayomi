name: add-fljtu-icon

on:
  push:
    paths:
      - '.github/workflows/add-fljtu-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write icon
        run: |
          if [ -f fljtu.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > fljtu.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add fljtu.png
          git commit -m "Add fljtu icon"
          git push

