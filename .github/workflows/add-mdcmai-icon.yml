name: add-mdcmai-icon

on:
  push:
    paths:
      - '.github/workflows/add-mdcmai-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write icon
        run: |
          if [ -f mdcmai.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > mdcmai.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add mdcmai.png
          git commit -m "Add mdcmai icon"
          git push
