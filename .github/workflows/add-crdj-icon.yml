name: add-crdj-icon

on:
  push:
    paths:
      - '.github/workflows/add-crdj-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write crdj icon
        run: |
          if [ -f crdj.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > crdj.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add crdj.png
          git commit -m "Add crdj icon"
          git push
