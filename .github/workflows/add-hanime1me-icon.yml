name: add-hanime1me-icon

on:
  push:
    paths:
      - '.github/workflows/add-hanime1me-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write icon png
        run: |
          if [ -f hanime1me.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > hanime1me.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add hanime1me.png
          git commit -m "Add Hanime1.me icon"
          git push
