name: add-alicesw-icon

on:
  push:
    paths:
      - '.github/workflows/add-alicesw-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write alicesw icon
        run: |
          if [ -f alicesw.png ]; then echo exists; exit 0; fi
          echo "" | base64 -d > alicesw.png
          git config user.name github-actions
          git config user.email actions@github.com
          git add alicesw.png
          git commit -m "Add alicesw icon"
          git push
